<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background circle -->
  <circle cx="32" cy="32" r="32" fill="#f97316"/>

  <!-- temple spire (shikhara) -->
  <polygon points="32,6 36,18 28,18" fill="white"/>
  <rect x="29" y="17" width="6" height="4" fill="white"/>

  <!-- middle tier -->
  <rect x="24" y="21" width="16" height="4" rx="1" fill="white"/>

  <!-- main body -->
  <rect x="20" y="25" width="24" height="14" rx="2" fill="white"/>

  <!-- door arch -->
  <path d="M28,39 L28,32 Q32,28 36,32 L36,39 Z" fill="#f97316"/>

  <!-- base platform -->
  <rect x="16" y="39" width="32" height="5" rx="1" fill="white"/>

  <!-- steps -->
  <rect x="18" y="44" width="28" height="3" rx="1" fill="#fed7aa"/>
  <rect x="20" y="47" width="24" height="3" rx="1" fill="#fdba74"/>

  <!-- flag on top -->
  <rect x="31" y="3" width="1.5" height="5" fill="#fef3c7"/>
  <polygon points="32.5,3 38,5 32.5,7" fill="#fef3c7"/>
</svg>
